# How MCPJam's PR checker builds and runs this server.
#
# Cloudflare Workers repo, so there is no Node HTTP server to start — `wrangler
# dev` runs the worker locally under workerd. Notes on why each line is what it
# is, since this is the first Workers repo to go through the checker:
#
#   build   `npm ci` only. There is no compile step; wrangler bundles at start.
#   start   the local binary, not `npx` — the package is already installed by
#           the build step, and the checker runs with NO internet access once
#           the build finishes, so anything that would fetch will fail.
#           `--ip 0.0.0.0` because the sandbox reaches the server from outside;
#           `--port` because wrangler defaults to 8787.
#   port    must match the --port above.
#   path    this worker only answers MCP on /mcp.
version: 1
checks:
  transport: streamable-http
  build: npm ci
  start: ./node_modules/.bin/wrangler dev --port 3001 --ip 0.0.0.0
  port: 3001
  path: /mcp
