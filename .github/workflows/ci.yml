name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Bundles the Worker and validates wrangler.jsonc (bindings, Durable
      # Object migrations) without credentials or uploading anything.
      - run: npx wrangler deploy --dry-run --outdir dist
